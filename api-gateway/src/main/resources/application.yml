server.port: 8080
spring:
  application.name: api-gateway
  config.import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      routes:
        # lb:// = client-side discovery through the service registry
        - id: orders
          uri: lb://order-service
          predicates: [ "Path=/api/orders/**" ]
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args: { name: orders, fallbackUri: "forward:/fallback/order-service" }
        - id: inventory
          uri: lb://inventory-service
          predicates: [ "Path=/api/inventory/**" ]
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args: { name: inventory, fallbackUri: "forward:/fallback/inventory-service" }
        - id: payments
          uri: lb://payment-service
          predicates: [ "Path=/api/payments/**" ]
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args: { name: payments, fallbackUri: "forward:/fallback/payment-service" }
        - id: query
          uri: lb://order-query-service
          predicates: [ "Path=/api/query/**" ]
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args: { name: query, fallbackUri: "forward:/fallback/order-query-service" }
        # Backend-for-frontend style route: a mobile-shaped URL space mapped onto the read model
        - id: mobile-bff
          uri: lb://order-query-service
          predicates: [ "Path=/mobile/orders/**" ]
          filters:
            - RewritePath=/mobile/orders/?(?<segment>.*), /query/orders/$\{segment}

security.jwt.secret: ${JWT_SECRET:change-me-change-me-change-me-32b!}

resilience4j.circuitbreaker.configs.default:
  sliding-window-size: 10
  failure-rate-threshold: 50
  wait-duration-in-open-state: 10s
# default is 1s, which cuts off slow-but-healthy composed calls
resilience4j.timelimiter.configs.default.timeout-duration: 5s

eureka:
  client.service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance.prefer-ip-address: true

management:
  endpoints.web.exposure.include: health,info,metrics,prometheus,gateway
  tracing.sampling.probability: 1.0
  zipkin.tracing.endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
logging.pattern.level: "%5p [${spring.application.name:-},%X{traceId:-},%X{spanId:-}]"
