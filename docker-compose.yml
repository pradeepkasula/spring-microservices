# Infra only:        docker compose up -d
# Infra + services:  docker compose --profile apps up -d --build
x-app: &app
  profiles: ["apps"]
  environment: &appenv
    KAFKA_BOOTSTRAP: kafka:19092
    EUREKA_URL: http://discovery-server:8761/eureka
    CONFIG_SERVER_URL: http://config-server:8888
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  zipkin:   # Distributed tracing UI -> http://localhost:9411
    image: openzipkin/zipkin:3
    ports: ["9411:9411"]

  discovery-server:
    <<: *app
    build: { context: ., args: { MODULE: discovery-server } }
    ports: ["8761:8761"]

  config-server:
    <<: *app
    build: { context: ., args: { MODULE: config-server } }
    ports: ["8888:8888"]

  api-gateway:
    <<: *app
    build: { context: ., args: { MODULE: api-gateway } }
    ports: ["8080:8080"]
    depends_on: [discovery-server, config-server]

  order-service:
    <<: *app
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8081:8081"]
    depends_on: [kafka, discovery-server, config-server]

  inventory-service:
    <<: *app
    build: { context: ., args: { MODULE: inventory-service } }
    ports: ["8082:8082"]
    depends_on: [kafka, discovery-server, config-server]

  payment-service:
    <<: *app
    build: { context: ., args: { MODULE: payment-service } }
    ports: ["8083:8083"]
    depends_on: [kafka, discovery-server, config-server]

  notification-service:
    <<: *app
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8084:8084"]
    depends_on: [kafka, discovery-server, config-server]

  order-query-service:
    <<: *app
    build: { context: ., args: { MODULE: order-query-service } }
    ports: ["8085:8085"]
    depends_on: [kafka, discovery-server, config-server]
